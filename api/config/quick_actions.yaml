# Quick Actions Configuration
# Context-aware chat shortcuts for different views

folder:
  - id: "folder_search_tasks"
    label: "חיפוש משימות"
    icon: "ListTodo"
    prompt_template: "מצא את כל התמלילים עם משימות ופעולות מעקב"
    description: "Search for action items across all transcripts in folder"

  - id: "folder_summary_email"
    label: "ניסוח אימייל סיכום"
    icon: "Mail"
    prompt_template: "נסח אימייל סיכום מקצועי על כל הפגישות האחרונות"
    description: "Generate a professional summary email of recent meetings"

  - id: "folder_find_qa"
    label: "מציאת שאלות ותשובות"
    icon: "HelpCircle"
    prompt_template: "חפש ורשום את כל השאלות והתשובות בכל התמלילים"
    description: "Extract all Q&A from transcripts in folder"

transcript:
  - id: "transcript_followup_email"
    label: "ניסוח אימייל מעקב"
    icon: "Mail"
    prompt_template: "כתוב מייל מעקב על סמך השיחה הזו"
    description: "Generate a follow-up email based on this conversation"

  - id: "transcript_action_items"
    label: "רשימת משימות"
    icon: "ListTodo"
    prompt_template: "רשום את כל פעולות המעקב מהתמליל הזה"
    description: "List all action items from this transcript"

  - id: "transcript_qa"
    label: "שאלות ותשובות"
    icon: "HelpCircle"
    prompt_template: "רשום את כל השאלות והתשובות מהתמליל הזה"
    description: "Extract all Q&A from this transcript"

